name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testy i budowanie
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk harmonogram-komor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: harmonogram-komor-apk
          path: harmonogram-komor.apk

      # Wydanie z plikiem APK – łatwo pobrać bezpośrednio na telefon (Releases -> Latest).
      - name: Publikacja w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Harmonogram komór (build ${{ github.run_number }})
          body: "APK zbudowany z gałęzi ${{ github.ref_name }} (commit ${{ github.sha }})."
          files: harmonogram-komor.apk
          make_latest: true
